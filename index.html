<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>СтопКоррупция — интерактивный квиз</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ФОН — ФЛАГ РОССИИ */
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(180deg,
      #ffffff 0%, #ffffff 33.33%,
      #0039a6 33.33%, #0039a6 66.66%,
      #d52b1e 66.66%, #d52b1e 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #fff;
    position: relative;
  }

  /* Буква Z — через псевдоэлемент, чтобы не мешала контенту */
  body::before {
    content: "Z";
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 60vh; font-weight: 900;
    color: rgba(255,255,255,0.07);
    font-family: 'Arial Black', sans-serif;
    line-height: 1;
    pointer-events: none;
    z-index: 0;
  }

  .card {
    background: rgba(15, 23, 42, 0.92);
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 20px; padding: 40px;
    max-width: 640px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    position: relative; z-index: 10;
  }

  /* Бейдж Z в углу */
  .z-badge {
    position: absolute; top: 15px; right: 20px;
    font-size: 22px; font-weight: 900; color: #fff;
    border: 2px solid #d52b1e; border-radius: 8px;
    padding: 2px 10px; background: #0039a6;
    box-shadow: 0 0 15px rgba(213, 43, 30, 0.6);
  }

  h1 { font-size: 26px; margin-bottom: 8px; text-align: center; }
  .sub { text-align: center; opacity: .8; margin-bottom: 24px; font-size: 14px; color: #dbeafe; }
  .progress { height: 8px; background: rgba(255,255,255,.15); border-radius: 4px; margin-bottom: 24px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #0039a6, #d52b1e); width: 0%; transition: width .4s ease; }

  .question {
    font-size: 19px; line-height: 1.5;
    margin-bottom: 22px; min-height: 60px;
    color: #f1f5f9;
  }
  .answers { display: flex; flex-direction: column; gap: 12px; }

  button.answer {
    padding: 16px 20px; border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: #fff; border-radius: 12px;
    font-size: 15px; cursor: pointer; text-align: left; transition: all .25s;
    font-family: inherit;
  }
  button.answer:hover:not(:disabled) { background: rgba(255,255,255,.2); transform: translateX(4px); }
  button.answer.correct { background: #16a34a; border-color: #22c55e; box-shadow: 0 0 25px rgba(34,197,94,.6); }
  button.answer.wrong   { background: #b91c1c; border-color: #ef4444; }

  .result { text-align: center; }
  .result .score {
    font-size: 90px; font-weight: 900; margin: 10px 0;
    background: linear-gradient(90deg, #ffffff, #0039a6, #d52b1e, #ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: scoreReveal 1s ease both, gradientMove 3s linear infinite;
  }
  @keyframes scoreReveal { 0% { opacity: 0; transform: scale(.3); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes gradientMove { to { background-position: 300% 0; } }

  .result .verdict { font-size: 18px; margin-bottom: 24px; line-height: 1.5; color: #f1f5f9; }
  .restart {
    padding: 14px 32px; background: #0039a6; color: #fff;
    border: 2px solid #d52b1e; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .restart:hover { background: #d52b1e; border-color: #0039a6; }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; opacity: .6; color: #cbd5e1; }

  .perfect-title {
    font-size: 34px; font-weight: 900; margin-bottom: 8px;
    background: linear-gradient(90deg,#ffffff,#0039a6,#d52b1e,#ffffff);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gradientMove 2s linear infinite;
  }
  .trophy { font-size: 80px; animation: bounce 1.2s infinite; display: inline-block; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-20px);} }

  .confetti {
    position: fixed; top: -20px; width: 12px; height: 12px;
    z-index: 9999; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

  .emoji-fly {
    position: fixed; z-index: 9998; pointer-events: none;
    font-size: 42px; animation: flyUp linear forwards;
  }
  @keyframes flyUp {
    0% { transform: translateY(0) scale(.5); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-90vh) scale(1.3) rotate(360deg); opacity: 0; }
  }

  .glow-ring {
    position: fixed; top: 50%; left: 50%;
    width: 200px; height: 200px; border-radius: 50%;
    border: 4px solid rgba(0,57,166,.8);
    transform: translate(-50%,-50%) scale(0);
    animation: ringExpand 1.5s ease-out forwards;
    pointer-events: none; z-index: 5;
  }
  @keyframes ringExpand {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(8); opacity: 0; }
  }
  .flash { position: fixed; inset: 0; background: #fff; z-index: 9997; pointer-events: none; animation: flashAnim .6s ease-out forwards; }
  @keyframes flashAnim { to { opacity: 0; } }
</style>
</head>
<body>

<div class="card" id="app">
  <div class="z-badge">Z</div>
  <h1>🛡️ СтопКоррупция</h1>
  <div class="sub">Интерактивный квиз • 8 вопросов</div>
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>
  <div class="footer">Квиз создан с использованием технологий ИИ • личный вклад: концепция, отбор вопросов, дизайн</div>
</div>

<script>
window.onload = function() {
  const questions = [
    { q: "Что такое коррупция в самом общем смысле?",
      a: ["Злоупотребление служебным положением в личных целях","Любая ошибка чиновника","Повышение по службе","Штраф за нарушение ПДД"], correct: 0 },
    { q: "Какое из этих действий является коррупционным правонарушением?",
      a: ["Получение взятки должностным лицом","Подарок учителю стоимостью 300 руб.","Оплата коммунальных услуг","Участие в выборах"], correct: 0 },
    { q: "Федеральный закон № 273-ФЗ регулирует:",
      a: ["Противодействие коррупции","Правила дорожного движения","Защиту прав потребителей","Трудовой кодекс"], correct: 0 },
    { q: "Что делать, если у вас вымогают взятку?",
      a: ["Сообщить в правоохранительные органы","Заплатить и забыть","Рассказать друзьям","Написать в соцсетях"], correct: 0 },
    { q: "Кто может быть субъектом коррупции?",
      a: ["Должностное лицо или управленец","Только президент","Любой гражданин","Только полицейский"], correct: 0 },
    { q: "Что такое «конфликт интересов»?",
      a: ["Личная заинтересованность влияет на службу","Спор двух коллег","Судебное разбирательство","Отказ от повышения"], correct: 0 },
    { q: "Куда можно сообщить о коррупции анонимно?",
      a: ["На горячую линию или через «Госуслуги»","Лично начальнику","Никуда","В газету"], correct: 0 },
    { q: "Главная цель противодействия коррупции:",
      a: ["Защита прав граждан и интересов государства","Ужесточение наказаний","Уменьшение чиновников","Рост налогов"], correct: 0 }
  ];

  questions.forEach(item => {
    const pairs = item.a.map((text, i) => ({ text, ok: i === item.correct }));
    pairs.sort(() => Math.random() - 0.5);
    item.a = pairs.map(p => p.text);
    item.correct = pairs.findIndex(p => p.ok);
  });

  let current = 0, score = 0;
  const app = document.getElementById('app');
  const questionEl = document.getElementById('question');
  const answersEl = document.getElementById('answers');
  const bar = document.getElementById('bar');

  function render() {
    if (current >= questions.length) return showResult();
    bar.style.width = (current / questions.length * 100) + '%';
    const item = questions[current];
    questionEl.textContent = item.q;
    answersEl.innerHTML = '';
    item.a.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer';
      btn.textContent = text;
      btn.onclick = () => select(i, btn);
      answersEl.appendChild(btn);
    });
  }

  function select(i, btn) {
    const item = questions[current];
    const buttons = answersEl.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);
    if (i === item.correct) { btn.classList.add('correct'); score++; }
    else { btn.classList.add('wrong'); buttons[item.correct].classList.add('correct'); }
    setTimeout(() => { current++; render(); }, 900);
  }

  function showResult() {
    bar.style.width = '100%';
    const percent = Math.round(score / questions.length * 100);
    const perfect = score === questions.length;
    let verdict;
    if (perfect) verdict = "Идеально! Ты настоящий знаток антикоррупционного законодательства 💪";
    else if (percent >= 75) verdict = "Отличный результат! Основы ты знаешь хорошо.";
    else if (percent >= 50) verdict = "Неплохо, но стоит повторить материал.";
    else verdict = "Попробуй ещё раз — тема важная и нужная!";

    app.innerHTML = `
      <div class="result">
        ${perfect ? '<div class="trophy">🏆</div><div class="perfect-title">ПОБЕДА!</div>' : '<h1>Результат</h1>'}
        <div class="score" id="scoreEl">0 / ${questions.length}</div>
        <div class="verdict">${verdict}</div>
        <button class="restart" onclick="location.reload()">Пройти заново</button>
        <div class="footer">Квиз создан с использованием технологий ИИ • личный вклад автора</div>
      </div>`;

    const scoreEl = document.getElementById('scoreEl');
    let n = 0;
    const timer = setInterval(() => {
      n++;
      scoreEl.textContent = n + ' / ' + questions.length;
      if (n >= score) clearInterval(timer);
    }, perfect ? 150 : 200);

    if (perfect) setTimeout(() => { launchConfetti(); launchEmojiRain(); launchRings(); launchFlash(); }, 1200);
  }

  function launchConfetti() {
    const colors = ['#ffffff','#0039a6','#d52b1e'];
    for (let i = 0; i < 200; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (6 + Math.random() * 10) + 'px';
      c.style.height = (6 + Math.random() * 14) + 'px';
      c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      c.style.animationDelay = (Math.random() * 1.5) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 7000);
    }
  }

  function launchEmojiRain() {
    const emojis = ['🎉','🏆','✨','💪','⭐','🎊','🛡️','🇷🇺','Z'];
    for (let i = 0; i < 35; i++) {
      const e = document.createElement('div');
      e.className = 'emoji-fly';
      e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      e.style.left = Math.random() * 90 + 'vw';
      e.style.bottom = '-60px';
      e.style.animationDuration = (3 + Math.random() * 3) + 's';
      e.style.animationDelay = (Math.random() * 2) + 's';
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 8000);
    }
  }

  function launchRings() {
    const ringColors = ['rgba(255,255,255,.8)','rgba(0,57,166,.8)','rgba(213,43,30,.8)','rgba(255,255,255,.8)'];
    for (let i = 0; i < 4; i++) {
      setTimeout(() => {
        const r = document.createElement('div');
        r.className = 'glow-ring';
        r.style.borderColor = ringColors[i];
        document.body.appendChild(r);
        setTimeout(() => r.remove(), 1600);
      }, i * 250);
    }
  }

  function launchFlash() {
    const f = document.createElement('div');
    f.className = 'flash';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 700);
  }

  render();
};
</script>
</body>
</html>
